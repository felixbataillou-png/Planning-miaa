<!DOCTYPE html>

<html lang="fr"><head><meta charset="utf-8">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Raleway',sans-serif;background:#f8f9fa;padding:24px;display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
.spec{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.spec small{font-size:11px;color:#888;font-family:monospace}

</style></head><body><div class="spec"><div class="miaa-slot miaa-slot--urgent">

   <div class="spec"><div class="miaa-slot miaa-slot--soon">

   <div class="spec"><div class="miaa-slot miaa-slot--normal">
    <div class="miaa-slot__header"><h3 class="miaa-slot__role" data-slot="role-name">Maraudeurs</h3><span class="miaa-slot__time" data-slot="role-time">11h – début d'après-midi</span></div>
    <div class="miaa-spots"><span class="miaa-spots__sq miaa-spots__sq--taken"></span><span class="miaa-spots__sq"></span><span class="miaa-spots__sq"></span><span class="miaa-spots__sq"></span></div><span class="miaa-slot__badge" data-slot="count"> 3 places</span><div class="miaa-slot__permis" data-slot="permis"><i class="fas fa-car"></i> Permis 1/2</div><button class="miaa-slot__cta" data-slot="cta">Je m'inscris</button></div><small>--normal</small></div>
