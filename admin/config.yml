# Configuration Decap CMS — Site MIAA

backend:
  name: git-gateway
  branch: main

site_url: https://miaa.fr
media_folder: assets/uploads
public_folder: assets/uploads
locale: fr

collections:

  # Actualités (page d'accueil) & Newsletters (page Newsletters)
  # Une même liste sert les deux pages : "Visible sur l'accueil" contrôle
  # l'affichage sur la page d'accueil, "Archivée" contrôle l'affichage dans
  # la liste des newsletters. Les deux sont indépendants — un article peut
  # être sur les deux pages à la fois, sur une seule, ou sur aucune.
  - name: actualites
    label: "Actualités & Newsletters"
    files:
      - name: actualites
        label: "Liste des actualités / newsletters"
        file: _content/actualites.json
        fields:
          - label: "Articles"
            name: articles
            widget: list
            label_singular: "Article"
            summary: "{{fields.titre}}"
            fields:
              - { label: "Titre", name: titre, widget: string }
              - { label: "Date", name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
              - { label: "Visible sur la page d'accueil", name: visible, widget: boolean, default: true }
              - { label: "Archivée (apparaît dans Newsletters)", name: archivee, widget: boolean, default: false,
                  hint: "Une fois archivée, cette newsletter reste consultable dans la liste Newsletters même si vous la retirez de l'accueil plus tard. Pour la retirer de l'accueil SANS perdre son archive : décochez 'Visible sur la page d'accueil' ci-dessus, ne supprimez pas cet article — le supprimer ici le retire aussi de l'archive." }
              - { label: "Contenu", name: contenu, widget: markdown }

  # Équipe
  - name: equipe
    label: "Équipe"
    files:
      - name: equipe
        label: "Membres de l'équipe"
        file: _content/equipe.json
        fields:
          - label: "Bureau"
            name: bureau
            widget: list
            summary: "{{fields.nom}}"
            fields:
              - { label: "Nom", name: nom, widget: string }
              - { label: "Rôle", name: role, widget: string }
          - label: "Conseil d'Administration"
            name: ca
            widget: list
            summary: "{{fields.nom}}"
            fields:
              - { label: "Nom", name: nom, widget: string }
          - { label: "Message hommage", name: hommage, widget: text }

  # Partenaires
  - name: partenaires
    label: "Partenaires"
    files:
      - name: partenaires
        label: "Liste des partenaires"
        file: _content/partenaires.json
        fields:
          - label: "Partenaires"
            name: partenaires
            widget: list
            summary: "{{fields.nom}}"
            fields:
              - { label: "Nom", name: nom, widget: string }
              - { label: "Site web", name: url, widget: string, required: false }
              - { label: "Description", name: description, widget: string, required: false }
              - { label: "Logo", name: logo, widget: image, required: false }

  # Newsletters
  - name: newsletters
    label: "Newsletters"
    files:
      - name: newsletters
        label: "Liste des newsletters"
        file: _content/newsletters.json
        fields:
          - label: "Newsletters"
            name: newsletters
            widget: list
            summary: "{{fields.titre}}"
            fields:
              - { label: "Titre", name: titre, widget: string }
              - { label: "Lien", name: url, widget: string }
              - { label: "Date", name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }

  # Presse et Médias
  - name: presse
    label: "Presse et Médias"
    files:
      - name: presse
        label: "Articles et vidéos"
        file: _content/presse.json
        fields:
          - label: "Contenus"
            name: contenus
            widget: list
            summary: "{{fields.titre}}"
            fields:
              - { label: "Titre", name: titre, widget: string }
              - { label: "Type", name: type, widget: select, options: ["Vidéo", "Article", "Photo"] }
              - { label: "Description", name: description, widget: text, required: false }
              - { label: "Fichier vidéo", name: video, widget: file, required: false }
              - { label: "Image", name: image, widget: image, required: false }
              - { label: "Lien externe", name: lien, widget: string, required: false }
              - { label: "Date", name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }


  # Photos d'en-tête (une par page publique, indépendantes les unes des
  # autres). Champ vide = photo par défaut (assets/hero-banner.jpg).
  - name: hero-images
    label: "Photos d'en-tête"
    files:
      - name: hero-images
        label: "Photo par page"
        file: _content/hero-images.json
        fields:
          - { label: "Accueil", name: accueil, widget: image, required: false, hint: "Laisser vide pour la photo par défaut." }
          - { label: "Inscription", name: inscription, widget: image, required: false }
          - { label: "Contact", name: contact, widget: image, required: false }
          - { label: "Informations pratiques", name: informations_pratiques, widget: image, required: false }
          - { label: "Équipe", name: equipe, widget: image, required: false }
          - { label: "Partenaires", name: partenaires, widget: image, required: false }
          - { label: "Presse et médias", name: presse_medias, widget: image, required: false }
          - { label: "RGPD", name: rgpd, widget: image, required: false }
          - { label: "Newsletters", name: newsletter, widget: image, required: false }

  # Configuration du planning
  - name: planning-config
    label: "Configuration du planning"
    files:
      - name: planning-config
        label: "Affichage du planning bénévole"
        file: _content/planning-config.json
        fields:
          - { label: "Masquer le planning", name: masquer, widget: boolean, default: false }
          - { label: "Message affiché à la place du planning", name: message, widget: markdown, hint: "Affiché uniquement quand le planning est masqué" }
