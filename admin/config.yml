# Configuration Decap CMS — Site MIAA

backend:
  name: git-gateway
  branch: main

site_url: https://miaa.fr
media_folder: assets/uploads
public_folder: assets/uploads
locale: fr

collections:

  # Actualités (page d'accueil)
  - name: actualites
    label: "Actualités (page d'accueil)"
    files:
      - name: actualites
        label: "Liste des actualités"
        file: _content/actualites.json
        fields:
          - label: "Articles"
            name: articles
            widget: list
            label_singular: "Article"
            summary: "{{fields.titre}}"
            fields:
              - { label: "Titre", name: titre, widget: string }
              - { label: "Date", name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
              - { label: "Visible sur le site", name: visible, widget: boolean, default: true }
              - { label: "Contenu", name: contenu, widget: markdown }

  # Équipe
  - name: equipe
    label: "Équipe"
    files:
      - name: equipe
        label: "Membres de l'équipe"
        file: _content/equipe.json
        fields:
          - label: "Bureau"
            name: bureau
            widget: list
            summary: "{{fields.nom}}"
            fields:
              - { label: "Nom", name: nom, widget: string }
              - { label: "Rôle", name: role, widget: string }
          - label: "Conseil d'Administration"
            name: ca
            widget: list
            summary: "{{fields.nom}}"
            fields:
              - { label: "Nom", name: nom, widget: string }
          - { label: "Message hommage", name: hommage, widget: text }

  # Partenaires
  - name: partenaires
    label: "Partenaires"
    files:
      - name: partenaires
        label: "Liste des partenaires"
        file: _content/partenaires.json
        fields:
          - label: "Partenaires"
            name: partenaires
            widget: list
            summary: "{{fields.nom}}"
            fields:
              - { label: "Nom", name: nom, widget: string }
              - { label: "Site web", name: url, widget: string, required: false }
              - { label: "Description", name: description, widget: string, required: false }
              - { label: "Logo", name: logo, widget: image, required: false }

  # Newsletters
  - name: newsletters
    label: "Newsletters"
    files:
      - name: newsletters
        label: "Liste des newsletters"
        file: _content/newsletters.json
        fields:
          - label: "Newsletters"
            name: newsletters
            widget: list
            summary: "{{fields.titre}}"
            fields:
              - { label: "Titre", name: titre, widget: string }
              - { label: "Lien", name: url, widget: string }
              - { label: "Date", name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }

  # Presse et Médias
  - name: presse
    label: "Presse et Médias"
    files:
      - name: presse
        label: "Articles et vidéos"
        file: _content/presse.json
        fields:
          - label: "Contenus"
            name: contenus
            widget: list
            summary: "{{fields.titre}}"
            fields:
              - { label: "Titre", name: titre, widget: string }
              - { label: "Type", name: type, widget: select, options: ["Vidéo", "Article", "Photo"] }
              - { label: "Description", name: description, widget: text, required: false }
              - { label: "Fichier vidéo", name: video, widget: file, required: false }
              - { label: "Image", name: image, widget: image, required: false }
              - { label: "Lien externe", name: lien, widget: string, required: false }
              - { label: "Date", name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }


  # Configuration du planning
  - name: planning-config
    label: "Configuration du planning"
    files:
      - name: planning-config
        label: "Affichage du planning bénévole"
        file: _content/planning-config.json
        fields:
          - { label: "Masquer le planning", name: masquer, widget: boolean, default: false }
          - { label: "Message affiché à la place du planning", name: message, widget: markdown, hint: "Affiché uniquement quand le planning est masqué" }
