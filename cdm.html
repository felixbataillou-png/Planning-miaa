<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MIAA — Espace CDM</title>
  <link rel="stylesheet" href="css/colors_and_type.css">
  <link rel="stylesheet" href="css/miaa-components.css">
  <link rel="stylesheet" href="css/planning-admin.css">
  <link rel="stylesheet" href="css/admin-site.css">
  <link rel="stylesheet" href="css/cdm.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
</head>
<body>

<a class="sr-only" href="#main-content">Aller au contenu principal</a>
<cdm-header></cdm-header>

<section class="hero" aria-label="En-tête espace CDM">
  <div class="hero-text">
    <h1>Planning de la semaine</h1>
    <p>Vue réservée au·à la CDM — consultation des inscriptions et notes de service.</p>
  </div>
</section>

<main class="page-wrap" id="main-content">


  <nav class="week-nav" aria-label="Navigation par semaine">
    <button id="btn-prev" onclick="changeWeek(-1)" disabled aria-label="Semaine précédente">
      <span class="btn-text">‹ Semaine précédente</span>
      <span class="btn-chevron" aria-hidden="true">‹</span>
    </button>
    <div class="week-label" id="week-label" aria-live="polite" aria-atomic="true">—</div>
    <button id="btn-next" onclick="changeWeek(1)" aria-label="Semaine suivante">
      <span class="btn-text">Semaine suivante ›</span>
      <span class="btn-chevron" aria-hidden="true">›</span>
    </button>
  </nav>

  <div class="planning-wrap">
    <div class="planning-grid" id="planning-grid"></div>
  </div>

</main>

<footer class="site-footer">
  <span>MIAA - 14, rue des Carrières d'Amérique 75019 Paris — Espace CDM</span>
</footer>

<!-- Modale : informations bénévole (lecture seule) + note éditable.
     Pas de statut, pas de suppression — le CDM ne peut ni ajouter ni
     retirer un bénévole, seulement consulter et annoter. -->
<div class="modal-overlay" id="modal-cdm-view" onclick="handleOverlayClick(event,'modal-cdm-view')">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="cdm-view-title">
    <div class="modal-header">
      <div>
        <h3 id="cdm-view-title">Informations du bénévole</h3>
        <div class="mh-sub" id="cdm-view-sub">—</div>
      </div>
      <button class="modal-close" onclick="closeModal('modal-cdm-view')" aria-label="Fermer la fenêtre">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label for="cdm-view-nom">Nom</label>
        <input type="text" id="cdm-view-nom" class="miaa-field-display" readonly>
      </div>
      <div class="form-group">
        <label for="cdm-view-prenom">Prénom</label>
        <input type="text" id="cdm-view-prenom" class="miaa-field-display" readonly>
      </div>
      <div class="form-group">
        <label for="cdm-view-tel">Téléphone</label>
        <input type="tel" id="cdm-view-tel" class="miaa-field-display" readonly>
      </div>
      <div id="edit-permis-display" style="display:none">
        <div style="background:#f0f9fc;border:1px solid #b8e0ec;border-radius:4px;padding:10px 12px;font-size:12px;color:#0f6980;display:flex;align-items:center;gap:8px">
          <i class="fas fa-car" aria-hidden="true"></i>
          <span>Possède le permis de conduire</span>
        </div>
      </div>
      <div class="form-group">
        <label for="cdm-view-note">Note / commentaire</label>
        <textarea id="cdm-view-note" rows="3" placeholder="Ajouter une note pour l'équipe planning…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-primary" id="cdm-view-save-btn" onclick="saveCdmNote()" disabled>
        <i class="fas fa-save" aria-hidden="true" style="margin-right:6px;font-size:11px"></i>Enregistrer
      </button>
    </div>
  </div>
</div>

<script src="js/cdm-site.js"></script>
<script src="js/cdm.js"></script>
</body>
</html>
