<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="L'équipe de l'association MIAA">
  <title>MIAA — Équipe</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="css/colors_and_type.css">
  <link rel="stylesheet" href="css/miaa-site.css">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.1/css/all.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800;900&display=swap">
</head>
<body>
<miaa-header page="association"></miaa-header>

<div class="hero"><div class="hero-text"><h1>Équipe</h1></div></div>

<main class="page-wrap" id="main-content">
  <div class="layout-with-sidebar">
    <miaa-sidebar></miaa-sidebar>
    <div class="main-content article-content" id="equipe-content">
      <p>Chargement...</p>
    </div>
  </div>
</main>

<miaa-footer></miaa-footer>
<script src="js/miaa-site.js"></script>
<script>
// Charge le contenu depuis le fichier JSON
fetch('_content/equipe.json')
  .then(r => r.json())
  .then(data => {
    const container = document.getElementById('equipe-content')

    // Bureau
    let html = '<h2>Bureau</h2>'
    data.bureau.forEach(membre => {
      html += `<p><strong>${membre.role}</strong> — ${membre.nom}</p>`
    })

    // Conseil d'Administration
    html += '<h2>Membres du Conseil d\'Administration</h2><ul>'
    data.ca.forEach(membre => {
      html += `<li>${membre.nom}</li>`
    })
    html += '</ul>'

    // Hommage
    if (data.hommage) {
      html += `<p><em>${data.hommage}</em></p>`
    }

    container.innerHTML = html
  })
  .catch(() => {
    document.getElementById('equipe-content').innerHTML =
      '<p>Impossible de charger le contenu. Merci de réessayer.</p>'
  })
</script>
</body>
</html>
