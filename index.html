<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Site de l'association MIAA d'aide aux sans-abri par les intermittents du spectacle">
  <title>MIAA — Accueil</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="css/colors_and_type.css">
  <link rel="stylesheet" href="css/miaa-site.css">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.1/css/all.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800;900&display=swap">
</head>
<body>

<miaa-header page="accueil"></miaa-header>

<div class="hero"><div class="hero-text"><h1>Accueil</h1></div></div>

<main class="page-wrap" id="main-content">
  <div class="layout-with-sidebar">
    <miaa-sidebar></miaa-sidebar>
    <div class="main-content article-content" id="actualites-content">
      <p>Chargement des actualités...</p>
    </div>
  </div>
</main>

<miaa-footer></miaa-footer>
<script src="js/miaa-site.js"></script>

<!-- Marked.js pour convertir le markdown en HTML -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
// Charge toutes les actualités depuis un seul fichier JSON
// Les non-devs gèrent ce fichier via le CMS — aucune modification du HTML nécessaire
fetch('_content/actualites.json')
  .then(r => r.json())
  .then(data => {
    const container = document.getElementById('actualites-content')

    const articles = (data.articles || [])
      .filter(a => a.visible !== false)
      .sort((a, b) => new Date(b.date) - new Date(a.date))

    if (articles.length === 0) {
      container.innerHTML = '<p>Aucune actualité pour le moment.</p>'
      return
    }

    let html = ''
    articles.forEach((article, index) => {
      if (index > 0) html += '<hr class="article-separator">'
      html += `<h2>${article.titre}</h2>`
      html += marked.parse(article.contenu)
    })

    container.innerHTML = html
  })
  .catch(() => {
    document.getElementById('actualites-content').innerHTML =
      '<p>Impossible de charger les actualités. Merci de réessayer.</p>'
  })
</script>

<!-- Netlify Identity -->
<script>window.netlifyIdentityUrl = "https://verdant-phoenix-e415b1.netlify.app";</script>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      if (!user) {
        window.netlifyIdentity.on("login", () => {
          document.location.href = "/admin/";
        });
      }
    });
  }
</script>

</body>
</html>
