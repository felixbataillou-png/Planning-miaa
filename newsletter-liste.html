<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Liste des newsletters de l'association MIAA">
  <title>MIAA — Newsletters</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="css/colors_and_type.css">
  <link rel="stylesheet" href="css/miaa-site.css">
  <link rel="stylesheet" href="css/newsletter-liste.css">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.1/css/all.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800;900&display=swap">
</head>
<body>
<miaa-header page="newsletter"></miaa-header>
<div class="hero" data-hero-key="newsletter"><h1>Newsletters</h1></div>
<main class="page-wrap" id="main-content">
  <div class="main-content article-content" style="max-width:800px;margin:0 auto">
    <p>Retrouvez ici les newsletters archivées de l'association MIAA. Cliquez sur un titre pour l'ouvrir.</p>
    <div class="newsletter-list" id="newsletter-list">
      <p>Chargement des newsletters…</p>
    </div>
    <p style="margin-top:24px;font-size:13px;color:#888">La liste complète comporte plus de 200 numéros depuis 2020. Pour accéder aux archives complètes, contactez-nous à <a href="mailto:miaa@miaa.fr">miaa@miaa.fr</a>.</p>
  </div>
</main>
<miaa-footer></miaa-footer>
<script src="js/miaa-site.js"></script>

<!-- Marked.js pour convertir le markdown en HTML (même moteur que la page d'accueil) -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
// Réutilise la même source que les actualités de l'accueil (_content/actualites.json) :
// seules les newsletters marquées "Archivée" dans le CMS apparaissent ici.
fetch('_content/actualites.json')
  .then(r => r.json())
  .then(data => {
    const container = document.getElementById('newsletter-list')

    const newsletters = (data.articles || [])
      .filter(a => a.archivee === true)
      .sort((a, b) => new Date(b.date) - new Date(a.date))

    if (newsletters.length === 0) {
      container.innerHTML = '<p>Aucune newsletter archivée pour le moment.</p>'
      return
    }

    const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')

    container.innerHTML = newsletters.map((item, i) => `
      <div class="newsletter-item">
        <button type="button" class="newsletter-item__toggle" aria-expanded="false"
          aria-controls="newsletter-panel-${i}" onclick="toggleNewsletter(this)">
          <span>${esc(item.titre)}</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="newsletter-item__panel" id="newsletter-panel-${i}" hidden>
          ${marked.parse(item.contenu || '')}
        </div>
      </div>
    `).join('')
  })
  .catch(() => {
    document.getElementById('newsletter-list').innerHTML =
      '<p>Impossible de charger les newsletters. Merci de réessayer.</p>'
  })

function toggleNewsletter(btn) {
  const panel = document.getElementById(btn.getAttribute('aria-controls'))
  const isOpen = btn.getAttribute('aria-expanded') === 'true'
  btn.setAttribute('aria-expanded', String(!isOpen))
  panel.hidden = isOpen
}
</script>

</body>
</html>
