<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Les partenaires de l'association MIAA">
  <title>MIAA — Partenaires</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="css/colors_and_type.css">
  <link rel="stylesheet" href="css/miaa-site.css">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.1/css/all.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800;900&display=swap">
</head>
<body>

<miaa-header page="association"></miaa-header>

<div class="hero" data-hero-key="partenaires"><h1>Partenaires</h1></div>
<main class="page-wrap" id="main-content">
  <div class="layout-with-sidebar">
    <miaa-sidebar></miaa-sidebar>
    <div class="main-content article-content">
      <p>MIAA remercie chaleureusement tous ses partenaires pour leur soutien.</p>
      <div class="partners-grid" id="partners-grid">
        <p>Chargement des partenaires…</p>
      </div>
    </div>
  </div>
</main>
<miaa-footer></miaa-footer>
<script src="js/miaa-site.js"></script>

<script>
// Charge les partenaires depuis le CMS — aucune modification du HTML
// nécessaire pour ajouter/retirer/modifier un partenaire.
fetch('_content/partenaires.json')
  .then(r => r.json())
  .then(data => {
    const container = document.getElementById('partners-grid')
    const partenaires = data.partenaires || []

    if (partenaires.length === 0) {
      container.innerHTML = '<p>Aucun partenaire pour le moment.</p>'
      return
    }

    const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')

    container.innerHTML = partenaires.map(p => {
      const label = esc(p.nom) + (p.description ? ` — ${esc(p.description)}` : '')
      const inner = `<strong>${label}</strong>`
      const content = p.url
        ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${inner}</a>`
        : inner
      const logo = p.logo
        ? `<img src="${esc(p.logo)}" alt="Logo ${esc(p.nom)}" class="partner-logo">`
        : ''
      return `<div class="partner-item">${content}${logo}</div>`
    }).join('')
  })
  .catch(() => {
    document.getElementById('partners-grid').innerHTML =
      '<p>Impossible de charger les partenaires. Merci de réessayer.</p>'
  })
</script>

</body>
</html>
